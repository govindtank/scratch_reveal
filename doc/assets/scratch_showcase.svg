<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15" />
      <stop offset="50%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="hologramFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="30%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)" />

  <g stroke="#1E293B" stroke-opacity="0.2" stroke-width="1">
    <path d="M0,68 H1200 M0,136 H1200 M0,204 H1200 M0,272 H1200 M0,340 H1200 M0,408 H1200 M0,476 H1200 M0,544 H1200 M0,612 H1200" />
    <path d="M68,0 V680 M136,0 V680 M204,0 V680 M272,0 V680 M340,0 V680 M408,0 V680 M476,0 V680 M544,0 V680 M612,0 V680 M680,0 V680 M748,0 V680 M816,0 V680 M884,0 V680 M952,0 V680 M1020,0 V680 M1088,0 V680 M1156,0 V680" />
  </g>

  <circle cx="280" cy="220" r="220" fill="#F59E0B" opacity="0.06" />
  <circle cx="950" cy="420" r="240" fill="#10B981" opacity="0.05" />

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect width="44" height="44" rx="10" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.5" />
    <text x="22" y="29" text-anchor="middle" font-size="20">🪙</text>

    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#F8FAFC">
      scratch_reveal
    </text>
    <text x="60" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">
      Turnkey RewardScratchCard • Confetti Cannon • Coin &amp; Brush Physics • Bitmask Grid Tracking
    </text>

    <g transform="translate(940, 6)">
      <rect width="130" height="30" rx="15" fill="#064E3B" fill-opacity="0.5" stroke="#10B981" stroke-width="1.2" />
      <text x="65" y="19" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#34D399">v1.3.0 READY</text>
    </g>
  </g>

  <!-- 3-CARD PROGRESSION SHOWCASE (Unscratched -> In-Progress -> Unlocked) -->

  <!-- CARD 1: Un-scratched Metallic Gold Foil -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <rect width="330" height="460" rx="20" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="1.5" />

    <!-- Gold Foil Surface -->
    <rect x="15" y="15" width="300" height="430" rx="16" fill="url(#goldFoil)" />

    <!-- Unscratched Content -->
    <g transform="translate(165, 140)" text-anchor="middle">
      <circle cx="0" cy="0" r="32" fill="#000000" fill-opacity="0.25" stroke="#FFF9C4" stroke-width="2" />
      <text x="0" y="10" font-size="28">🪙</text>

      <text x="0" y="70" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">
        Scratch &amp; Win
      </text>
      <text x="0" y="92" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#FEF08A">
        Reveal surprise cashback
      </text>

      <g transform="translate(-75, 125)">
        <rect width="150" height="32" rx="16" fill="#000000" fill-opacity="0.3" stroke="#FFFFFF" stroke-opacity="0.4" />
        <text x="75" y="20" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" letter-spacing="1">
          👆 TOUCH &amp; GOUGE
        </text>
      </g>
    </g>

    <text x="165" y="420" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#78350F">
      1. METALLIC FOIL COVER
    </text>
  </g>

  <!-- CARD 2: Active Scratching with Coin Shavings & Particles -->
  <g transform="translate(435, 120)" filter="url(#shadow)">
    <rect width="330" height="460" rx="20" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="1.5" />

    <!-- Card Background (Revealed Base) -->
    <rect x="15" y="15" width="300" height="430" rx="16" fill="#030712" />

    <!-- Peek at Prize underneath -->
    <g transform="translate(165, 180)" text-anchor="middle">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#F8FAFC">
        ₹ 250
      </text>
      <text x="0" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#10B981">
        CASHBACK UNLOCKED
      </text>
    </g>

    <!-- Scratched Foil Overlay with Gouge Mask -->
    <path d="M 15 31 Q 15 15 31 15 L 299 15 Q 315 15 315 31 L 315 429 Q 315 445 299 445 L 31 445 Q 15 445 15 429 Z
             M 100 150 C 130 90, 200 110, 240 140 C 270 170, 250 250, 210 270 C 170 290, 110 260, 90 220 Z"
          fill="url(#goldFoil)" fill-rule="evenodd" />

    <!-- Flying Foil Sparkle Dust -->
    <circle cx="230" cy="130" r="3" fill="#FEF08A" />
    <circle cx="250" cy="155" r="2" fill="#FEF08A" />
    <circle cx="220" cy="245" r="3.5" fill="#FEF08A" />
    <polygon points="260,140 262,145 267,147 262,149 260,154 258,149 253,147 258,145" fill="#FFFFFF" />

    <!-- Coin Cursor -->
    <g transform="translate(245, 180)">
      <circle cx="0" cy="0" r="22" fill="#F59E0B" stroke="#FEF08A" stroke-width="2.5" />
      <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#78350F">¢</text>
    </g>

    <!-- Progress Pill -->
    <g transform="translate(35, 410)">
      <rect width="260" height="18" rx="9" fill="#1E293B" />
      <rect width="145" height="18" rx="9" fill="#10B981" />
      <text x="130" y="13" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#FFFFFF">
        55% SCRATCHED • AUTO-REVEAL
      </text>
    </g>
  </g>

  <!-- CARD 3: Unlocked Reward with Confetti Celebration -->
  <g transform="translate(810, 120)" filter="url(#shadow)">
    <rect width="330" height="460" rx="20" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="1.5" />

    <!-- Revealed Card Content -->
    <g transform="translate(165, 60)" text-anchor="middle">
      <!-- Gift Icon -->
      <circle cx="0" cy="0" r="28" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
      <text x="0" y="8" font-size="24">🎉</text>

      <text x="0" y="60" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">
        ₹ 250 Cashback
      </text>
      <text x="0" y="80" font-family="-apple-system, sans-serif" font-size="11.5" fill="#94A3B8">
        Credited on orders above ₹499
      </text>

      <!-- Promo Code Box -->
      <g transform="translate(-95, 110)">
        <rect width="190" height="48" rx="10" fill="#030712" stroke="#10B981" stroke-width="1.5" stroke-dasharray="5,4" />
        <text x="95" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#67E8F9" letter-spacing="2">
          SWIGGY250
        </text>
      </g>

      <text x="0" y="180" font-family="-apple-system, sans-serif" font-size="10.5" fill="#64748B">
        Expires in 48 hours • Single Use
      </text>

      <!-- Claim Button -->
      <g transform="translate(-75, 205)">
        <rect width="150" height="38" rx="10" fill="#10B981" />
        <text x="75" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#000000">
          Claim Now
        </text>
      </g>
    </g>

    <!-- Confetti Ribbons Bursting -->
    <g>
      <rect x="50" y="40" width="8" height="4" rx="2" fill="#F59E0B" transform="rotate(25 50 40)" />
      <rect x="280" y="55" width="9" height="5" rx="2" fill="#38BDF8" transform="rotate(-35 280 55)" />
      <rect x="70" y="120" width="7" height="4" rx="2" fill="#EC4899" transform="rotate(45 70 120)" />
      <rect x="260" y="140" width="8" height="4" rx="2" fill="#10B981" transform="rotate(-15 260 140)" />
      <rect x="40" y="240" width="9" height="4.5" rx="2" fill="#FBBF24" transform="rotate(60 40 240)" />
      <rect x="290" y="230" width="8" height="4" rx="2" fill="#A855F7" transform="rotate(-40 290 230)" />
    </g>

    <!-- Pub Command Strip -->
    <g transform="translate(25, 400)">
      <rect width="280" height="36" rx="8" fill="#030712" stroke="#10B981" stroke-width="1" />
      <text x="140" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#34D399">
        $ flutter pub add scratch_reveal
      </text>
    </g>
  </g>
</svg>
